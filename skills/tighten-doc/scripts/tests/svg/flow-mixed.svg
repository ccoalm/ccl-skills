<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Mixed flow directions">
 <title>Mixed flow directions</title>
 <defs><style>.ok{font-size:14px;fill:#111827}.flow{fill:none;stroke:#0072B2;marker-end:url(#a)}</style>
 <marker id="a" refX="10" refY="6"><path d="M1 1L11 6L1 11Z" fill="#0072B2"/></marker></defs>
 <g>
  <path class="flow" d="M20 20 L180 20"/><text x="90" y="14" class="ok">向右</text>
  <path class="flow" d="M200 40 L40 40"/><text x="110" y="34" class="ok">向左</text>
  <path class="flow" d="M300 20 L300 90"/><text x="308" y="55" class="ok">向下</text>
  <rect x="10" y="120" width="14" height="14" fill="#0072B2"/><text x="32" y="132" class="ok">图例一</text>
  <rect x="10" y="145" width="14" height="14" fill="#D55E00"/><text x="32" y="157" class="ok">图例二</text>
  <rect x="10" y="170" width="14" height="14" fill="#009E73"/><text x="32" y="182" class="ok">图例三</text>
 </g>
</svg>
