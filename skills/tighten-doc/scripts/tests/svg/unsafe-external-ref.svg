<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="external image reference">
 <title>External image reference</title>
 <defs><style>.ok{font-size:14px;fill:#111827}</style></defs>
 <g>
 <rect x="0" y="0" width="400" height="200" fill="#FFFFFF"/>
  <image x="200" y="20" width="40" height="40" href="https://example.invalid/logo.png"/>
  <rect x="10" y="120" width="14" height="14" fill="#0072B2"/><text x="32" y="132" class="ok">图例一</text>
  <rect x="10" y="145" width="14" height="14" fill="#D55E00"/><text x="32" y="157" class="ok">图例二</text>
  <rect x="10" y="170" width="14" height="14" fill="#009E73"/><text x="32" y="182" class="ok">图例三</text>
 </g>
</svg>
