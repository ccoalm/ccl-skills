name: Publish npm package

on:
  push:
    tags:
      - "ccl-skills-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ccl-skills-npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node -e 'const p=require("./package.json"); if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(p.version)) throw new Error(`release version must be stable MAJOR.MINOR.PATCH: ${p.version}`); if(process.env.RELEASE_TAG!==`ccl-skills-v${p.version}`) throw new Error(`tag ${process.env.RELEASE_TAG} does not match ${p.version}`)'
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack and bind the exact artifact to the tagged commit
        env:
          EXPECT_SOURCE_COMMIT: ${{ github.sha }}
          REQUIRE_CLEAN_RELEASE: "1"
        run: npm run test:pack
      - name: Publish the verified tarball with npm Trusted Publishing
        env:
          EXPECT_SOURCE_COMMIT: ${{ github.sha }}
          REQUIRE_CLEAN_RELEASE: "1"
          # Blank out setup-node's placeholder token so a failed OIDC exchange
          # fails loudly as ENEEDAUTH instead of publishing with a garbage
          # bearer token (registry masks that as E404).
          NODE_AUTH_TOKEN: ""
          # Surface npm's oidc decision trail (logged at verbose level only).
          NPM_CONFIG_LOGLEVEL: verbose
        run: node scripts/publish-artifact.mjs artifacts/pack-metadata.json
