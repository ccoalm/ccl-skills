        run: |
          if [[ -n "$CANDIDATE_BASE_REF" ]] && git merge-base "$CANDIDATE_BASE_REF" HEAD >/dev/null 2>&1; then
            export CCL_SKILL_BASE_REF="$CANDIDATE_BASE_REF"
          fi
          make test-code-review-2

  # Own job on purpose, never a member of a parallel shard: each of this probe's two
  # legs runs a whole round of test_review_gate.sh and waits for one of its hang cases
  # to be in flight, so sharing a runner stretches that round past any sane budget —
  # measured in shard 1, where it burned 408s without ever reaching the target case.
  # One job per leg, never a member of a parallel shard. Each leg runs a whole round of
  # test_review_gate.sh and waits for a hang case to be in flight, so sharing a runner
  # stretches that round past any budget — measured in shard 1, where it burned 408s
  # without reaching its target. Running BOTH legs in one job made it the longest branch
  # (213s/214s against 190s for the next longest), and shortening the leg-2 wait moved
  # that by 1s: the cost is the two suite runs, not the wait. Split, these jobs measure
  # 177s and 114s against 188s for the longest branch — this gate costs no critical path. The split also follows the coverage structure: the reaper
  # is ONE shared code path (leg 1 proves it once) while the lifetime bound is duplicated
  # per fixture stub, so leg 2 runs against both the claude stub and the candidate stub the
  # fallback clients share — measured: reverting only the candidate stub's bound reds
  # leg2/fallback while leg2/claude stays green. Needs no ripgrep/node: the suite it drives
  # uses only python3 and shasum.
  code-review-abort-leak-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Abort-leak probe, leg 1 (claude stub) + leg 2 (fallback stub)
        run: make test-code-review-abort-leak-1

  code-review-abort-leak-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Abort-leak probe, leg 2 (claude stub, untrappable abort falls back to the bound)
        run: make test-code-review-abort-leak-2

  # The fast regression lane as its own parallel job: it used to run inside
  # regression-heavy's --full superset, serial in front of the heavy suites
  # (specs/036-ci-parallel-shards/plan.md). Same base-ref guard as the other
  # jobs — the fast lane's catalog suite drives clones that need
  # CCL_SKILL_BASE_REF (the 022 round's observed failure class).
  regression-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Judge the BRANCH, not the merge ref — see
          # test_ci_checkout_ref_binding.sh for why the impact-chain gate
          # needs the branch's own first-parent chain.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install validation tools
        run: |
          set -euo pipefail
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
