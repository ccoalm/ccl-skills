          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          if ! curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 900 \
            --connect-timeout 15 --max-time 300 \
            --output "$temp_dir/$archive" \
            "$download_url"; then
            echo "failed to download pinned ripgrep ${RIPGREP_VERSION} asset: $download_url" >&2
            exit 1
          fi
          printf '%s  %s\n' "$RIPGREP_SHA256" "$temp_dir/$archive" | sha256sum --check -
          tar --extract --gzip --file "$temp_dir/$archive" --directory "$temp_dir"
          sudo install --mode 0755 "$temp_dir/$extract_dir/rg" /usr/local/bin/rg
          resolved_rg="$(command -v rg)"
          if [[ "$resolved_rg" != /usr/local/bin/rg ]]; then
            echo "unexpected ripgrep on PATH: $resolved_rg" >&2
            exit 1
          fi
          installed_version="$(rg --version | head -n 1)"
          case "$installed_version" in
            "ripgrep $RIPGREP_VERSION"*) ;;
            *) echo "unexpected ripgrep version: $installed_version" >&2; exit 1 ;;
          esac
          printf '%s\n' "$installed_version"
          # ubuntu-latest includes Ruby; fail fast if that runner contract changes
          # instead of reintroducing the apt mirror dependency on this required job.
          ruby --version
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Code-review regression shard 1
        env:
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$CANDIDATE_BASE_REF" ]] && git merge-base "$CANDIDATE_BASE_REF" HEAD >/dev/null 2>&1; then
            export CCL_SKILL_BASE_REF="$CANDIDATE_BASE_REF"
          fi
          make test-code-review-1

  code-review-regressions-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Judge the BRANCH, not the synthetic merge ref. The impact-chain gate
          # partitions history into rounds by walking the branch's own
          # first-parent chain — a flag its own fixtures pin as load-bearing,
          # because it is what collapses a merged worktree round to one
