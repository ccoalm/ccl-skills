        run: python3 -m pip install -r requirements-test.txt
      - name: Fast regression lane
        env:
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$CANDIDATE_BASE_REF" ]] && git merge-base "$CANDIDATE_BASE_REF" HEAD >/dev/null 2>&1; then
            export CCL_SKILL_BASE_REF="$CANDIDATE_BASE_REF"
          fi
          bash skills/skill-extraction-workflow/scripts/test_check_ccl_regressions.sh --fast

  # The heavy regression lane (the whole-repo-clone suites: r0 status,
  # source-register lifecycle, impact-chain refscripts, firing-path wiring),
  # now --heavy-only: the fast layer runs in the parallel regression-fast job
  # instead of serially in front of these suites. Without this job the heavy
  # suites never execute anywhere and can rot silently — observed once as a
  # wiring fixture that stayed broken undetected. Local `--full` remains the
  # aggregate (`make test-check-ccl-regressions`).
  regression-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Judge the BRANCH, not the merge ref — see
          # test_ci_checkout_ref_binding.sh for why the impact-chain gate
          # needs the branch's own first-parent chain.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install validation tools
        run: |
          set -euo pipefail
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          extract_dir="${archive%.tar.gz}"
          download_url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${archive}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          if ! curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 900 \
            --connect-timeout 15 --max-time 300 \
            --output "$temp_dir/$archive" \
            "$download_url"; then
            echo "failed to download pinned ripgrep ${RIPGREP_VERSION} asset: $download_url" >&2
            exit 1
          fi
          printf '%s  %s\n' "$RIPGREP_SHA256" "$temp_dir/$archive" | sha256sum --check -
          tar --extract --gzip --file "$temp_dir/$archive" --directory "$temp_dir"
          sudo install --mode 0755 "$temp_dir/$extract_dir/rg" /usr/local/bin/rg
          resolved_rg="$(command -v rg)"
