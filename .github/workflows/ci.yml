name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  RIPGREP_VERSION: "15.2.0"
  RIPGREP_SHA256: "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Judge the BRANCH, not the synthetic merge ref. The impact-chain gate
          # partitions history into rounds by walking the branch's own
          # first-parent chain — a flag its own fixtures pin as load-bearing,
          # because it is what collapses a merged worktree round to one
          # boundary. On the default `refs/pull/N/merge` checkout that chain
          # runs through the TARGET, so every round on the branch collapses
          # into one and rows whose validity depends on their round being
          # narrow flip red with nothing about them changed (observed on PR #53:
          # `impact_chain_firing_path_missing` for a description-only round that
          # a sibling round's body edit swallowed). `main` requires branches to
          # be up to date, so the head commit already contains the base and the
          # merge commit adds no content — the branch tip is what actually lands.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install validation tools
        run: |
          set -euo pipefail
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          extract_dir="${archive%.tar.gz}"
          download_url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${archive}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          if ! curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 900 \
            --connect-timeout 15 --max-time 300 \
            --output "$temp_dir/$archive" \
            "$download_url"; then
            echo "failed to download pinned ripgrep ${RIPGREP_VERSION} asset: $download_url" >&2
            exit 1
          fi
          printf '%s  %s\n' "$RIPGREP_SHA256" "$temp_dir/$archive" | sha256sum --check -
          tar --extract --gzip --file "$temp_dir/$archive" --directory "$temp_dir"
          sudo install --mode 0755 "$temp_dir/$extract_dir/rg" /usr/local/bin/rg
          resolved_rg="$(command -v rg)"
          if [[ "$resolved_rg" != /usr/local/bin/rg ]]; then
            echo "unexpected ripgrep on PATH: $resolved_rg" >&2
            exit 1
          fi
          installed_version="$(rg --version | head -n 1)"
          case "$installed_version" in
            "ripgrep $RIPGREP_VERSION"*) ;;
            *) echo "unexpected ripgrep version: $installed_version" >&2; exit 1 ;;
          esac
          printf '%s\n' "$installed_version"
          # ubuntu-latest includes Ruby; fail fast if that runner contract changes
          # instead of reintroducing the apt mirror dependency on this required job.
          ruby --version
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Public sanitization regression
        run: python3 scripts/test_check_public_sanitization.py
      - name: Public sanitization gate
        run: python3 scripts/check-public-sanitization.py .
      - name: Markdown link gate
        run: python3 scripts/check-markdown-links.py .
      - name: Spec reference gate
        run: python3 scripts/check-spec-references.py .
      - name: Skill count regression
        run: python3 scripts/test_check_skill_count.py
      - name: Skill count gate
        run: python3 scripts/check-skill-count.py .
      # test-repo-gates, not `make test`: the code-review family runs in the
      # parallel code-review-regressions job, and the fast regression lane runs
      # exactly once per pipeline inside regression-heavy's --full superset —
      # this job's `make test` used to be the 18-minute critical path
      # (specs/035-ci-critical-path-split/plan.md).
      - name: Repository gate suite
        env:
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$CANDIDATE_BASE_REF" ]] && git merge-base "$CANDIDATE_BASE_REF" HEAD >/dev/null 2>&1; then
            export CCL_SKILL_BASE_REF="$CANDIDATE_BASE_REF"
          fi
          make test-repo-gates
      # The review ledger was caller-built and caller-run, and nothing at merge
      # time read it: which candidate the rounds actually inspected went
      # unchecked. This binds the landing candidate to the evidence that
      # inspected it. It is base-relative, so a run without a resolvable base
      # reports itself unevaluated rather than passing.
      # Scoped to the one event that carries a base, on purpose: any other event
      # would have to pass by letting the gate exit clean having checked nothing,
      # and a required job that passes without checking is worse than no job.
      #
      # Merge queues are NOT covered, and the coverage boundary is stated here
      # rather than implied by a branch that cannot run. This step once also named
      # `merge_group`, but `on:` above never subscribed to that event, so in a
      # merge-queue run this workflow would not start at all -- the condition read
      # as coverage while providing none. Enabling a queue therefore needs more
      # than restoring the trigger: a merge_group HEAD combines several queued pull
      # requests, and each committed ledger binds one individual candidate, so no
      # ledger binds the aggregate and every otherwise-valid queued request would
      # be refused. Two other aggregates ARE covered (see the gate's docstring):
      # a single candidate too large for one packet, bound part by part through a
      # committed landing partition manifest; and an integration branch that
      # accumulated several already-bound rounds and is promoted as one pull
      # request, bound round by round along its first-parent chain because each
      # round's own merge was bound here when it landed. Queued requests have no
      # such merges yet, which is why the queue case stays unsolved; until it is
      # solved, do not enable a merge queue on a branch that requires this check.
      #
      # Direct pushes to a protected branch are refused by the platform, which is
      # the other residual this scoping leaves and does not close.
      - name: Review ledger binds the landing candidate
        if: github.event_name == 'pull_request'
        env:
          CANDIDATE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 skills/skill-extraction-workflow/scripts/review_ledger_binding.py \
            --repo-root . --base "$CANDIDATE_BASE_REF"

  # The code-review skill's regression family, sharded into two parallel jobs
  # balanced by measured suite time (specs/036-ci-parallel-shards/plan.md; the
  # single job was the 12-minute critical path). Setup steps and the base-ref
  # guard mirror repository-gates verbatim (the 022 round's first CI run went
  # red exactly because a new job dropped the env guard). Both shards must be
  # required checks: a missing shard means a red code-review suite could merge
  # while every required check stays green.
  code-review-regressions-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Judge the BRANCH, not the synthetic merge ref. The impact-chain gate
          # partitions history into rounds by walking the branch's own
          # first-parent chain — a flag its own fixtures pin as load-bearing,
          # because it is what collapses a merged worktree round to one
          # boundary. On the default `refs/pull/N/merge` checkout that chain
          # runs through the TARGET, so every round on the branch collapses
          # into one and rows whose validity depends on their round being
          # narrow flip red with nothing about them changed (observed on PR #53:
          # `impact_chain_firing_path_missing` for a description-only round that
          # a sibling round's body edit swallowed). `main` requires branches to
          # be up to date, so the head commit already contains the base and the
          # merge commit adds no content — the branch tip is what actually lands.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
